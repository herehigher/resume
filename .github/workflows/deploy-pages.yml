name: Deploy Pages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to redeploy, for example v0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate exact release tag and commit
        id: release
        env:
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_REF: ${{ github.ref }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        run: node scripts/validate-release-ref.mjs

  quality:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.release_sha }}
    permissions:
      contents: read

  artifact:
    needs: [validate, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      adapter_digest: ${{ steps.manifest.outputs.adapter_digest }}
      analytics_mode: ${{ steps.manifest.outputs.analytics_mode }}
      analytics_provider: ${{ steps.manifest.outputs.analytics_provider }}
      final_digest: ${{ steps.final.outputs.final_digest }}
      provider_fingerprint: ${{ steps.manifest.outputs.provider_fingerprint }}
      source_digest: ${{ steps.manifest.outputs.source_digest }}
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate tagged Pages manifest without provider token
        id: manifest
        run: >-
          node scripts/prepare-pages-artifact.mjs validate
          --source site
          --manifest .github/pages-release-manifest.json

      - name: Reject enabled analytics outside the official repository
        if: ${{ github.repository != 'herehigher/resume' && steps.manifest.outputs.analytics_mode == 'enabled' }}
        run: |
          echo 'Enabled analytics artifacts are restricted to herehigher/resume.' >&2
          exit 1

      - name: Prepare official Cloudflare-enabled artifact
        if: ${{ github.repository == 'herehigher/resume' && steps.manifest.outputs.analytics_mode == 'enabled' && steps.manifest.outputs.analytics_provider == 'cloudflare-web-analytics' }}
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: >-
          node scripts/prepare-pages-artifact.mjs prepare
          --source site
          --output "${RUNNER_TEMP}/resume-pages-site"
          --manifest .github/pages-release-manifest.json
          --repository "${GITHUB_REPOSITORY}"

      - name: Prepare analytics-disabled artifact
        if: ${{ steps.manifest.outputs.analytics_mode == 'disabled' && steps.manifest.outputs.analytics_provider == 'none' }}
        run: >-
          node scripts/prepare-pages-artifact.mjs prepare
          --source site
          --output "${RUNNER_TEMP}/resume-pages-site"
          --manifest .github/pages-release-manifest.json
          --repository "${GITHUB_REPOSITORY}"

      - name: Verify source checkout stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- site
          test -z "$(git status --porcelain=v1 --untracked-files=all -- site)"
          node scripts/prepare-pages-artifact.mjs validate \
            --source site \
            --manifest .github/pages-release-manifest.json

      - name: Verify final artifact digest
        id: final
        run: >-
          node scripts/prepare-pages-artifact.mjs verify
          --directory "${RUNNER_TEMP}/resume-pages-site"
          --manifest .github/pages-release-manifest.json

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/resume-pages-site

  deploy:
    needs: [validate, artifact]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: [validate, artifact, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      EXPECTED_PAGE_URL: https://herehigher.github.io/resume/
      ANALYTICS_MODE: ${{ needs.artifact.outputs.analytics_mode }}
      ANALYTICS_PROVIDER: ${{ needs.artifact.outputs.analytics_provider }}
      PROVIDER_FINGERPRINT: ${{ needs.artifact.outputs.provider_fingerprint }}
      PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
    steps:
      - name: Checkout validated smoke contract
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify deployed public paths
        shell: bash
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}/"
          page_authority="${base_url#https://}"
          page_authority="${page_authority%%/*}"
          if [[ "$base_url" != https://*
            || -z "$page_authority"
            || "$page_authority" == *'@'*
            || "$base_url" == *'?'*
            || "$base_url" == *'#'* ]]; then
            echo 'Pages returned an unsafe deployment URL.' >&2
            exit 1
          fi
          if [[ "$REPOSITORY" == 'herehigher/resume' ]]; then
            test "$base_url" = "$EXPECTED_PAGE_URL"
          fi

          if [[ "$ANALYTICS_MODE" == 'disabled'
            && "$ANALYTICS_PROVIDER" == 'none'
            && "$PROVIDER_FINGERPRINT" == 'none' ]]; then
            :
          elif [[ "$ANALYTICS_MODE" == 'enabled'
            && "$ANALYTICS_PROVIDER" == 'cloudflare-web-analytics'
            && "$PROVIDER_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
            :
          else
            echo 'Unsupported deployed analytics configuration.' >&2
            exit 1
          fi

          smoke_dir="${RUNNER_TEMP}/resume-pages-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$smoke_dir"

          fetch_and_check() {
            local path="$1"
            local output="$2"
            local marker="$3"
            local attempts=4
            local attempt response_metadata
            local last_result='request did not complete'

            for ((attempt = 1; attempt <= attempts; attempt += 1)); do
              if response_metadata="$(curl --fail --silent --show-error \
                --proto '=https' \
                --connect-timeout 10 \
                --max-time 30 \
                --output "${smoke_dir}/${output}" \
                --write-out 'HTTP %{http_code}; type=%{content_type}; url=%{url_effective}' \
                "${base_url}${path}?release=${RELEASE_SHA}&attempt=${attempt}")"; then
                if grep --fixed-strings --quiet "$marker" "${smoke_dir}/${output}"; then
                  return 0
                fi
                last_result="${response_metadata}; expected marker not found"
              else
                last_result='HTTPS request failed'
              fi

              if ((attempt < attempts)); then
                sleep 3
              fi
            done

            echo "Pages smoke failed for '${path:-/}' after ${attempts} attempts: ${last_result}." >&2
            if [[ -f "${smoke_dir}/${output}" ]]; then
              echo "Last public response: bytes=$(wc -c < "${smoke_dir}/${output}"), sha256=$(sha256sum "${smoke_dir}/${output}" | cut -d ' ' -f 1)." >&2
            fi
            return 1
          }

          fetch_and_check '' root.html '<title>Resume Studio'
          fetch_and_check 'ja/' ja.html '<title>'
          fetch_and_check 'zh-cn/' zh-cn.html '<title>'
          fetch_and_check 'en/' en.html '<title>'
          fetch_and_check 'editor/' editor.html '<title>'
          fetch_and_check 'sitemap.xml' sitemap.xml '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          fetch_and_check 'schema/resume-studio-web-v1.schema.json' schema.json '"title": "Resume Studio web v1 export"'
          fetch_and_check 'schema/resume-studio-web-v1.example.json' example.json '"version": 1'
          fetch_and_check 'assets/js/config.js' config.js "APP_VERSION = '${PACKAGE_VERSION}'"
          mkdir -p "$smoke_dir/ja" "$smoke_dir/zh-cn" "$smoke_dir/en" "$smoke_dir/editor" "$smoke_dir/assets/js"
          mv "$smoke_dir/root.html" "$smoke_dir/index.html"
          mv "$smoke_dir/ja.html" "$smoke_dir/ja/index.html"
          mv "$smoke_dir/zh-cn.html" "$smoke_dir/zh-cn/index.html"
          mv "$smoke_dir/en.html" "$smoke_dir/en/index.html"
          mv "$smoke_dir/editor.html" "$smoke_dir/editor/index.html"
          mv "$smoke_dir/config.js" "$smoke_dir/assets/js/config.js"
          node scripts/validate-pages-smoke.mjs \
            --directory "$smoke_dir" \
            --analytics-mode "$ANALYTICS_MODE" \
            --analytics-provider "$ANALYTICS_PROVIDER" \
            --package-version "$PACKAGE_VERSION" \
            --provider-fingerprint "$PROVIDER_FINGERPRINT"
