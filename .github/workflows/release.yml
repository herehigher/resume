name: Release Pages

run-name: Release Pages

on:
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Completed eligible Quality workflow run ID
        required: false
        type: string

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      quality_run_id: ${{ steps.release.outputs.quality_run_id }}
      release_required: ${{ steps.release.outputs.release_required }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve merge authorization
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id || '' }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'herehigher/resume'
          test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"
          test -n "$QUALITY_RUN_ID"
          eligibility="$RUNNER_TEMP/release-eligibility"
          GITHUB_OUTPUT="$eligibility" node scripts/validate-release-run.mjs eligibility --run-id "$QUALITY_RUN_ID"
          quality_run_id="$(sed -n 's/^quality_run_id=//p' "$eligibility")"
          release_required="$(sed -n 's/^release_required=//p' "$eligibility")"
          release_sha="$(sed -n 's/^release_sha=//p' "$eligibility")"
          release_tag="$(sed -n 's/^release_tag=//p' "$eligibility")"
          test "$quality_run_id" = "$QUALITY_RUN_ID"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$release_required" = true
          test -n "$release_tag"
          {
            echo '## Release authorization revalidated'
            echo "- Tag / source: \`$release_tag\` / \`$release_sha\`"
            echo "- Quality: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${quality_run_id}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "quality_run_id=$quality_run_id" >> "$GITHUB_OUTPUT"
          echo "release_required=$release_required" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  prepare:
    needs: authorize
    if: ${{ needs.authorize.outputs.release_required == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_digest: ${{ steps.evidence.outputs.artifact_digest }}
      package_version: ${{ steps.evidence.outputs.package_version }}
      prepared_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_digest: ${{ steps.evidence.outputs.source_digest }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout the authorized source
        id: source
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/release-source" "$RELEASE_SHA"
          git -C "$RUNNER_TEMP/release-source" lfs pull \
            --include="docs/screenshots/*.png,output/pdf/*.pdf" --exclude=""

      - name: Verify the successful main Quality run for the exact release commit
        id: quality
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RUN_ID: ${{ needs.authorize.outputs.quality_run_id }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALITY_RUN_ID"
          node scripts/validate-release-run.mjs quality --sha "$RELEASE_SHA" --run-id "$QUALITY_RUN_ID"

      - name: Download exact Quality documentation assets
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: documentation-assets-${{ needs.authorize.outputs.release_sha }}
          path: ${{ runner.temp }}/quality-documentation-assets
          run-id: ${{ steps.quality.outputs.run_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install documentation asset verification dependencies
        run: npm ci

      - name: Verify release documentation assets are current for final Quality source
        env:
          SOURCE_ROOT: ${{ runner.temp }}/release-source
          SOURCE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: >-
          node scripts/release-doc-assets.mjs compare-current
          --committed-root "${SOURCE_ROOT}"
          --generated-root "${{ runner.temp }}/quality-documentation-assets"
          --source-sha "${SOURCE_SHA}"

      - name: Prepare the immutable site artifact
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          SOURCE_ROOT: ${{ runner.temp }}/release-source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-site-artifact.mjs prepare \
            --source "$SOURCE_ROOT/site" --output "$RUNNER_TEMP/site-artifact"
          node scripts/release-artifact-evidence.mjs create \
            --artifact-dir "$RUNNER_TEMP/site-artifact" --evidence "$RUNNER_TEMP/release-evidence.json" \
            --source-dir "$SOURCE_ROOT" --source-sha "$RELEASE_SHA"
          node scripts/validate-pages-smoke.mjs --directory "$RUNNER_TEMP/site-artifact" \
            --package-version "$(jq -r .version "$SOURCE_ROOT/package.json")"

      - name: Export non-secret artifact evidence
        id: evidence
        env:
          EVIDENCE: ${{ runner.temp }}/release-evidence.json
          QUALITY_RUN_ID: ${{ steps.quality.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact_digest=$(jq -r '.artifactDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "package_version=$(jq -r '.packageVersion' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "source_digest=$(jq -r '.sourceDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          {
            echo '## Site artifact prepared after merge authorization'
            echo
            echo "- Tag / source: \`${{ needs.authorize.outputs.release_tag }}\` / \`${{ needs.authorize.outputs.release_sha }}\`"
            echo "- Source digest: \`$(jq -r '.sourceDigest' "$EVIDENCE")\`"
            echo "- Artifact digest: \`$(jq -r '.artifactDigest' "$EVIDENCE")\`"
            echo "- Quality: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable prepared artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: site-release-artifact-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/site-artifact
            ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [authorize, prepare]
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ vars.PRODUCTION_ORIGIN }}
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download only this run's prepared artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prepared
          artifact-ids: ${{ needs.prepare.outputs.prepared_artifact_id }}
          merge-multiple: true
          run-id: ${{ github.run_id }}

      - name: Read prepared source identity
        id: prepared
        env:
          EVIDENCE: ${{ runner.temp }}/prepared/release-evidence.json
          EXPECTED_SHA: ${{ needs.authorize.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE"
          release_sha="$(jq -r '.sourceSha' "$EVIDENCE")"
          test "$release_sha" = "$EXPECTED_SHA"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$(jq -r '.artifactDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact prepared source beside trusted tooling
        env:
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/${{ github.event.repository.default_branch }}"
          git worktree add --detach "$RUNNER_TEMP/prepared-source" "$RELEASE_SHA"

      - name: Recheck current version under the production lock
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVIDENCE: ${{ runner.temp }}/prepared/release-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          prepared_version="$(jq -er '.packageVersion' "$EVIDENCE")"
          current_version="$(git show "origin/$DEFAULT_BRANCH:package.json" | jq -er '.version')"
          test "$prepared_version" = "$current_version"

      - name: Reverify bytes and create or resume the immutable tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release-publication.mjs publish \
            --artifact-dir "$RUNNER_TEMP/prepared/site-artifact" --evidence "$RUNNER_TEMP/prepared/release-evidence.json" \
            --source-dir "$RUNNER_TEMP/prepared-source" --source-sha "$RELEASE_SHA" --cwd . --tag "$RELEASE_TAG"
          remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          local_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ -z "$remote_sha" ]]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "refs/tags/$RELEASE_TAG"
          elif [[ "$remote_sha" != "$local_sha" ]]; then
            echo 'Remote tag points to a different commit.' >&2
            exit 1
          fi

      - name: Record tag outcome
        if: ${{ always() }}
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        run: |
          {
            echo '## Immutable tag result'
            echo "- Tag / SHA: ${RELEASE_TAG} / ${RELEASE_SHA:-unavailable}"
            echo "- Artifact ID: ${{ needs.prepare.outputs.prepared_artifact_id }}"
            echo "- Tag step: ${{ steps.tag.outcome }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify original bytes against the tagged source
        env:
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        run: |
          set -euo pipefail
          node scripts/release-artifact-evidence.mjs verify \
            --artifact-dir "$RUNNER_TEMP/prepared/site-artifact" --evidence "$RUNNER_TEMP/prepared/release-evidence.json" \
            --source-dir "$RUNNER_TEMP/prepared-source" --source-sha "$RELEASE_SHA"

      - name: Upload the verified original bytes for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/prepared/site-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Install online smoke dependencies
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Smoke test deployed public paths and editor
        id: smoke
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PRODUCTION_ORIGIN" = 'https://rs.herehigher.com/'
          node scripts/validate-pages-smoke.mjs --base-url "$PRODUCTION_ORIGIN" --release-sha "$RELEASE_SHA" \
            --package-version "${RELEASE_TAG#v}"
          node scripts/check-online-editor.mjs --base-url "$PRODUCTION_ORIGIN"
          {
            echo '## Pages release result'
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Source SHA: \`$RELEASE_SHA\`"
            echo "- Artifact ID: \`${{ needs.prepare.outputs.prepared_artifact_id }}\`"
            echo "- URL: ${PRODUCTION_ORIGIN}"
            echo '- Smoke: passed; Cloudflare Pages Analytics injection and manual browser acceptance remain unverified.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record publication outcome
        if: ${{ always() }}
        env:
          ARTIFACT_DIGEST: ${{ steps.prepared.outputs.artifact_digest }}
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
        shell: bash
        run: |
          {
            echo '## Pages publication outcome'
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Source SHA: \`${RELEASE_SHA:-unavailable}\`"
            echo "- Run / artifact: \`${GITHUB_RUN_ID}\` / \`${{ needs.prepare.outputs.prepared_artifact_id }}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-unavailable}\`"
            echo "- URL: ${PRODUCTION_ORIGIN:-unavailable}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Tag: ${{ steps.tag.outcome }}; deploy: ${{ steps.deployment.outcome }}; smoke: ${{ steps.smoke.outcome }}"
            echo '- Unverified: Cloudflare Pages Analytics injection and manual browser acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
