name: Release Pages

run-name: Release Pages

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: Accepted historical release tag to restore
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      quality_run_id: ${{ steps.release.outputs.quality_run_id }}
      recovery: ${{ steps.release.outputs.recovery }}
      release_required: ${{ steps.release.outputs.release_required }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve merge authorization or accepted recovery
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          QUALITY_RUN_ID: ${{ github.event.workflow_run.id }}
          QUALITY_SHA: ${{ github.event.workflow_run.head_sha }}
          RECOVERY_TAG: ${{ inputs.recovery_tag || '' }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'herehigher/resume'
          test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/release-publication.mjs rollback --tag "$RECOVERY_TAG"
            release_sha="$(git rev-parse --verify --end-of-options "$RECOVERY_TAG^{commit}")"
            git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH"
            quality_run_id=''
            recovery=true
            release_required=true
            release_tag="$RECOVERY_TAG"
          else
            test -z "$RECOVERY_TAG"
            release_sha="$QUALITY_SHA"
            quality_run_id="$QUALITY_RUN_ID"
            [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$quality_run_id" =~ ^[1-9][0-9]*$ ]]
            node scripts/validate-release-run.mjs quality --sha "$release_sha" --run-id "$quality_run_id"
            git fetch --no-tags origin "$release_sha"
            git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH"
            read -ra parents <<<"$(git rev-list --parents -n 1 "$release_sha")"
            test "${#parents[@]}" -ge 2
            pull_requests="$(gh api "repos/$REPOSITORY/commits/$release_sha/pulls")"
            authorized="$(jq --arg branch "$DEFAULT_BRANCH" --arg repository "$REPOSITORY" --arg sha "$release_sha" \
              '[.[] | select(.state == "closed" and .merged_at != null and .base.ref == $branch and
                .base.repo.full_name == $repository and .merge_commit_sha == $sha)]' <<<"$pull_requests")"
            authorized_count="$(jq 'length' <<<"$authorized")"
            test "$authorized_count" -le 1
            if [[ "$authorized_count" -eq 1 ]]; then
              base_sha="$(jq -r '.[0].base.sha' <<<"$authorized")"
              [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
              git merge-base --is-ancestor "$base_sha" "$release_sha"
            else
              base_sha="${parents[1]}"
            fi
            classification="$RUNNER_TEMP/release-classification"
            GITHUB_OUTPUT="$classification" node scripts/release-doc-assets.mjs required \
              --base "$base_sha" --head "$release_sha"
            release_required="$(sed -n 's/^required=//p' "$classification")"
            test "$release_required" = true || test "$release_required" = false
            recovery=false
            if [[ "$release_required" == false ]]; then
              release_tag=''
              {
                echo '## No release requested'
                echo "The successful main Quality source did not change the package version: \`$release_sha\`."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              test "$authorized_count" -eq 1
              package_version="$(git show "$release_sha:package.json" | jq -er '.version')"
              [[ "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              current_version="$(git show "origin/$DEFAULT_BRANCH:package.json" | jq -er '.version')"
              if [[ "$package_version" != "$current_version" ]]; then
                release_required=false
                release_tag=''
                {
                  echo '## Stale release ignored'
                  echo "The authorized source version \`$package_version\` is not current main version \`$current_version\`."
                } >> "$GITHUB_STEP_SUMMARY"
              else
                release_tag="v$package_version"
                {
                  echo '## Release authorized by merge'
                  echo "- Pull request: #$(jq -r '.[0].number' <<<"$authorized")"
                  echo "- Tag / source: \`$release_tag\` / \`$release_sha\`"
                  echo "- Quality: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${quality_run_id}"
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "quality_run_id=$quality_run_id" >> "$GITHUB_OUTPUT"
          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
          echo "release_required=$release_required" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  prepare:
    needs: authorize
    if: ${{ needs.authorize.outputs.release_required == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      analytics_mode: ${{ steps.evidence.outputs.analytics_mode }}
      analytics_provider: ${{ steps.evidence.outputs.analytics_provider }}
      artifact_digest: ${{ steps.evidence.outputs.artifact_digest }}
      package_version: ${{ steps.evidence.outputs.package_version }}
      prepared_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_digest: ${{ steps.evidence.outputs.source_digest }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout the authorized source
        id: source
        env:
          RECOVERY: ${{ needs.authorize.outputs.recovery }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RECOVERY" == true ]]; then
            mkdir "$RUNNER_TEMP/release-source"
            git archive --format=tar "$RELEASE_SHA" | tar -xf - -C "$RUNNER_TEMP/release-source"
            manifest_path="$RUNNER_TEMP/legacy-pages-release-manifest.json"
            node scripts/prepare-legacy-release-config.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-source" "$manifest_path"
          else
            git fetch --no-tags origin "$RELEASE_SHA"
            git worktree add --detach "$RUNNER_TEMP/release-source" "$RELEASE_SHA"
            manifest_path="$RUNNER_TEMP/release-source/.github/pages-release-manifest.json"
          fi
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "analytics_mode=$(jq -r '.analyticsMode' "$manifest_path")" >> "$GITHUB_OUTPUT"
          echo "analytics_provider=$(jq -r '.analyticsProvider' "$manifest_path")" >> "$GITHUB_OUTPUT"

      - name: Verify the successful main Quality run for the exact release commit
        id: quality
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RUN_ID: ${{ needs.authorize.outputs.quality_run_id }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(quality --sha "$RELEASE_SHA")
          if [[ -n "$QUALITY_RUN_ID" ]]; then args+=(--run-id "$QUALITY_RUN_ID"); fi
          node scripts/validate-release-run.mjs "${args[@]}"

      - name: Download exact Quality documentation assets
        if: ${{ needs.authorize.outputs.recovery != 'true' }}
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: documentation-assets-${{ needs.authorize.outputs.release_sha }}
          path: ${{ runner.temp }}/quality-documentation-assets
          run-id: ${{ steps.quality.outputs.run_id }}

      - name: Verify release documentation assets are current for final Quality source
        if: ${{ needs.authorize.outputs.recovery != 'true' }}
        env:
          SOURCE_ROOT: ${{ runner.temp }}/release-source
          SOURCE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: >-
          node scripts/release-doc-assets.mjs compare
          --committed-root "${SOURCE_ROOT}"
          --generated-root "${{ runner.temp }}/quality-documentation-assets"
          --source-sha "${SOURCE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare the single Pages artifact
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          ANALYTICS_MODE: ${{ steps.source.outputs.analytics_mode }}
          ANALYTICS_PROVIDER: ${{ steps.source.outputs.analytics_provider }}
          MANIFEST_PATH: ${{ steps.source.outputs.manifest_path }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          SOURCE_ROOT: ${{ runner.temp }}/release-source
        shell: bash
        run: |
          set -euo pipefail
          token=''
          if [[ "$ANALYTICS_MODE" == enabled ]]; then token="$CLOUDFLARE_WEB_ANALYTICS_TOKEN"; fi
          CLOUDFLARE_WEB_ANALYTICS_TOKEN="$token" node scripts/prepare-pages-artifact.mjs prepare \
            --source "$SOURCE_ROOT/site" --output "$RUNNER_TEMP/pages-site" \
            --manifest "$MANIFEST_PATH" --repository "$GITHUB_REPOSITORY"
          node scripts/release-artifact-evidence.mjs create \
            --analytics-mode "$ANALYTICS_MODE" --analytics-provider "$ANALYTICS_PROVIDER" \
            --artifact-dir "$RUNNER_TEMP/pages-site" --evidence "$RUNNER_TEMP/release-evidence.json" \
            --source-dir "$SOURCE_ROOT" --source-sha "$RELEASE_SHA"
          node scripts/validate-pages-smoke.mjs --directory "$RUNNER_TEMP/pages-site" \
            --analytics-mode "$ANALYTICS_MODE" --analytics-provider "$ANALYTICS_PROVIDER" \
            --package-version "$(jq -r .version "$SOURCE_ROOT/package.json")"

      - name: Install live provider compatibility dependencies
        if: ${{ steps.source.outputs.analytics_mode == 'enabled' }}
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Check actual provider compatibility before publication
        if: ${{ steps.source.outputs.analytics_mode == 'enabled' }}
        run: >-
          node scripts/check-cloudflare-analytics-compatibility.mjs
          --directory "${{ runner.temp }}/pages-site"
          --output "${{ runner.temp }}/provider-compatibility.json"

      - name: Record provider observation scope
        if: ${{ always() && steps.source.outputs.analytics_mode == 'enabled' }}
        env:
          PROVIDER_REPORT: ${{ runner.temp }}/provider-compatibility.json
        run: |
          {
            echo '## Live provider compatibility'
            echo 'Actual provider script; RUM intercepted locally. Provider receipt is not checked.'
            if test -f "$PROVIDER_REPORT"; then
              echo '```json'
              cat "$PROVIDER_REPORT"
              echo '```'
            else
              echo 'Compatibility evidence unavailable; preparation cannot be accepted.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export non-secret artifact evidence
        id: evidence
        env:
          EVIDENCE: ${{ runner.temp }}/release-evidence.json
          QUALITY_RUN_ID: ${{ steps.quality.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact_digest=$(jq -r '.artifactDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "analytics_mode=$(jq -r '.analyticsMode' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "analytics_provider=$(jq -r '.analyticsProvider' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "package_version=$(jq -r '.packageVersion' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "source_digest=$(jq -r '.sourceDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          {
            echo '## Pages artifact prepared after merge authorization'
            echo
            echo "- Tag / source: \`${{ needs.authorize.outputs.release_tag }}\` / \`${{ needs.authorize.outputs.release_sha }}\`"
            echo "- Source digest: \`$(jq -r '.sourceDigest' "$EVIDENCE")\`"
            echo "- Artifact digest: \`$(jq -r '.artifactDigest' "$EVIDENCE")\`"
            echo "- Quality: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable prepared artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: pages-release-artifact-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pages-site
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/provider-compatibility.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [authorize, prepare]
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download only this run's prepared artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prepared
          artifact-ids: ${{ needs.prepare.outputs.prepared_artifact_id }}
          merge-multiple: true
          run-id: ${{ github.run_id }}

      - name: Read prepared source identity
        id: prepared
        env:
          EVIDENCE: ${{ runner.temp }}/prepared/release-evidence.json
          EXPECTED_SHA: ${{ needs.authorize.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE"
          release_sha="$(jq -r '.sourceSha' "$EVIDENCE")"
          test "$release_sha" = "$EXPECTED_SHA"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "analytics_mode=$(jq -r '.analyticsMode' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "analytics_provider=$(jq -r '.analyticsProvider' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$(jq -r '.artifactDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact prepared source beside trusted tooling
        env:
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/${{ github.event.repository.default_branch }}"
          git worktree add --detach "$RUNNER_TEMP/prepared-source" "$RELEASE_SHA"

      - name: Recheck current version under the production lock
        if: ${{ needs.authorize.outputs.recovery != 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVIDENCE: ${{ runner.temp }}/prepared/release-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          prepared_version="$(jq -er '.packageVersion' "$EVIDENCE")"
          current_version="$(git show "origin/$DEFAULT_BRANCH:package.json" | jq -er '.version')"
          test "$prepared_version" = "$current_version"

      - name: Reverify bytes and create or resume the immutable tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
          ANALYTICS_MODE: ${{ steps.prepared.outputs.analytics_mode }}
          ANALYTICS_PROVIDER: ${{ steps.prepared.outputs.analytics_provider }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release-publication.mjs publish \
            --artifact-dir "$RUNNER_TEMP/prepared/pages-site" --evidence "$RUNNER_TEMP/prepared/release-evidence.json" \
            --source-dir "$RUNNER_TEMP/prepared-source" --source-sha "$RELEASE_SHA" --cwd . --tag "$RELEASE_TAG"
          remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          local_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ -z "$remote_sha" ]]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "refs/tags/$RELEASE_TAG"
          elif [[ "$remote_sha" != "$local_sha" ]]; then
            echo 'Remote tag points to a different commit.' >&2
            exit 1
          fi

      - name: Record tag outcome
        if: ${{ always() }}
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        run: |
          {
            echo '## Immutable tag result'
            echo "- Tag / SHA: ${RELEASE_TAG} / ${RELEASE_SHA:-unavailable}"
            echo "- Artifact ID: ${{ needs.prepare.outputs.prepared_artifact_id }}"
            echo "- Tag step: ${{ steps.tag.outcome }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify original bytes against the tagged source
        env:
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          ANALYTICS_MODE: ${{ steps.prepared.outputs.analytics_mode }}
          ANALYTICS_PROVIDER: ${{ steps.prepared.outputs.analytics_provider }}
        run: |
          set -euo pipefail
          node scripts/release-artifact-evidence.mjs verify \
            --analytics-mode "$ANALYTICS_MODE" --analytics-provider "$ANALYTICS_PROVIDER" \
            --artifact-dir "$RUNNER_TEMP/prepared/pages-site" --evidence "$RUNNER_TEMP/prepared/release-evidence.json" \
            --source-dir "$RUNNER_TEMP/prepared-source" --source-sha "$RELEASE_SHA"

      - name: Upload the verified original bytes for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/prepared/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Install online smoke dependencies
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Smoke test deployed public paths and editor
        id: smoke
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
          ANALYTICS_MODE: ${{ steps.prepared.outputs.analytics_mode }}
          ANALYTICS_PROVIDER: ${{ steps.prepared.outputs.analytics_provider }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-pages-smoke.mjs --base-url "${PAGE_URL%/}/" --release-sha "$RELEASE_SHA" \
            --analytics-mode "$ANALYTICS_MODE" --analytics-provider "$ANALYTICS_PROVIDER" \
            --package-version "${RELEASE_TAG#v}"
          node scripts/check-online-editor.mjs --base-url "${PAGE_URL%/}/"
          {
            echo '## Pages release result'
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Source SHA: \`$RELEASE_SHA\`"
            echo "- Artifact ID: \`${{ needs.prepare.outputs.prepared_artifact_id }}\`"
            echo "- URL: ${PAGE_URL}"
            echo '- Smoke: passed; live RUM receipt and manual browser acceptance remain unverified.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record publication outcome
        if: ${{ always() }}
        env:
          ARTIFACT_DIGEST: ${{ steps.prepared.outputs.artifact_digest }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
        shell: bash
        run: |
          {
            echo '## Pages publication outcome'
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Source SHA: \`${RELEASE_SHA:-unavailable}\`"
            echo "- Run / artifact: \`${GITHUB_RUN_ID}\` / \`${{ needs.prepare.outputs.prepared_artifact_id }}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-unavailable}\`"
            echo "- URL: ${PAGE_URL:-unavailable}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Tag: ${{ steps.tag.outcome }}; deploy: ${{ steps.deployment.outcome }}; smoke: ${{ steps.smoke.outcome }}"
            echo '- Unverified: live RUM receipt and manual browser acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
