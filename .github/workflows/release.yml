name: Release production

run-name: Release production

on:
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Completed eligible Quality workflow run ID
        required: false
        type: string

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      quality_run_id: ${{ steps.release.outputs.quality_run_id }}
      release_required: ${{ steps.release.outputs.release_required }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve merge authorization
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id || '' }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'herehigher/resume'
          test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"
          test -n "$QUALITY_RUN_ID"
          eligibility="$RUNNER_TEMP/release-eligibility"
          GITHUB_OUTPUT="$eligibility" node scripts/validate-release-run.mjs eligibility --run-id "$QUALITY_RUN_ID"
          quality_run_id="$(sed -n 's/^quality_run_id=//p' "$eligibility")"
          release_required="$(sed -n 's/^release_required=//p' "$eligibility")"
          release_sha="$(sed -n 's/^release_sha=//p' "$eligibility")"
          release_tag="$(sed -n 's/^release_tag=//p' "$eligibility")"
          test "$quality_run_id" = "$QUALITY_RUN_ID"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$release_required" = true
          test -n "$release_tag"
          {
            echo '## Release authorization revalidated'
            echo "- Tag / source: \`$release_tag\` / \`$release_sha\`"
            echo "- Quality: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${quality_run_id}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "quality_run_id=$quality_run_id" >> "$GITHUB_OUTPUT"
          echo "release_required=$release_required" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  prepare:
    needs: authorize
    if: ${{ needs.authorize.outputs.release_required == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_digest: ${{ steps.evidence.outputs.artifact_digest }}
      package_version: ${{ steps.evidence.outputs.package_version }}
      prepared_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_digest: ${{ steps.evidence.outputs.source_digest }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout the authorized source
        id: source
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/release-source" "$RELEASE_SHA"
          git -C "$RUNNER_TEMP/release-source" lfs pull \
            --include="docs/screenshots/*.png,output/pdf/*.pdf" --exclude=""

      - name: Verify the successful main Quality run for the exact release commit
        id: quality
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RUN_ID: ${{ needs.authorize.outputs.quality_run_id }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALITY_RUN_ID"
          node scripts/validate-release-run.mjs quality --sha "$RELEASE_SHA" --run-id "$QUALITY_RUN_ID"

      - name: Download exact Quality documentation assets
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: documentation-assets-${{ needs.authorize.outputs.release_sha }}
          path: ${{ runner.temp }}/quality-documentation-assets
          run-id: ${{ steps.quality.outputs.run_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install documentation asset verification dependencies
        run: npm ci

      - name: Verify release documentation assets are current for final Quality source
        env:
          SOURCE_ROOT: ${{ runner.temp }}/release-source
          SOURCE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: >-
          node scripts/release-doc-assets.mjs compare-current
          --committed-root "${SOURCE_ROOT}"
          --generated-root "${{ runner.temp }}/quality-documentation-assets"
          --source-sha "${SOURCE_SHA}"

      - name: Prepare the immutable site artifact
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          SOURCE_ROOT: ${{ runner.temp }}/release-source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-site-artifact.mjs prepare \
            --source "$SOURCE_ROOT/site" --output "$RUNNER_TEMP/site-artifact"
          node scripts/release-artifact-evidence.mjs create \
            --artifact-dir "$RUNNER_TEMP/site-artifact" --evidence "$RUNNER_TEMP/release-evidence.json" \
            --source-dir "$SOURCE_ROOT" --source-sha "$RELEASE_SHA"
          node scripts/validate-deployment-smoke.mjs --directory "$RUNNER_TEMP/site-artifact" \
            --package-version "$(jq -r .version "$SOURCE_ROOT/package.json")"

      - name: Export non-secret artifact evidence
        id: evidence
        env:
          EVIDENCE: ${{ runner.temp }}/release-evidence.json
          QUALITY_RUN_ID: ${{ steps.quality.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact_digest=$(jq -r '.artifactDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "package_version=$(jq -r '.packageVersion' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "source_digest=$(jq -r '.sourceDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          {
            echo '## Site artifact prepared after merge authorization'
            echo
            echo "- Tag / source: \`${{ needs.authorize.outputs.release_tag }}\` / \`${{ needs.authorize.outputs.release_sha }}\`"
            echo "- Source digest: \`$(jq -r '.sourceDigest' "$EVIDENCE")\`"
            echo "- Artifact digest: \`$(jq -r '.artifactDigest' "$EVIDENCE")\`"
            echo "- Quality: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable prepared artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: site-release-artifact-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/site-artifact
            ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [authorize, prepare]
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_ORIGIN }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download only this run's prepared artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prepared
          artifact-ids: ${{ needs.prepare.outputs.prepared_artifact_id }}
          merge-multiple: true
          run-id: ${{ github.run_id }}

      - name: Read prepared source identity
        id: prepared
        env:
          EVIDENCE: ${{ runner.temp }}/prepared/release-evidence.json
          EXPECTED_SHA: ${{ needs.authorize.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE"
          release_sha="$(jq -r '.sourceSha' "$EVIDENCE")"
          test "$release_sha" = "$EXPECTED_SHA"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$(jq -r '.artifactDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact prepared source beside trusted tooling
        env:
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/${{ github.event.repository.default_branch }}"
          git worktree add --detach "$RUNNER_TEMP/prepared-source" "$RELEASE_SHA"

      - name: Recheck current version under the production lock
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVIDENCE: ${{ runner.temp }}/prepared/release-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          prepared_version="$(jq -er '.packageVersion' "$EVIDENCE")"
          current_version="$(git show "origin/$DEFAULT_BRANCH:package.json" | jq -er '.version')"
          test "$prepared_version" = "$current_version"

      - name: Reverify bytes and create or resume the immutable tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release-publication.mjs publish \
            --artifact-dir "$RUNNER_TEMP/prepared/site-artifact" --evidence "$RUNNER_TEMP/prepared/release-evidence.json" \
            --source-dir "$RUNNER_TEMP/prepared-source" --source-sha "$RELEASE_SHA" --cwd . --tag "$RELEASE_TAG"
          remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          local_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ -z "$remote_sha" ]]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "refs/tags/$RELEASE_TAG"
          elif [[ "$remote_sha" != "$local_sha" ]]; then
            echo 'Remote tag points to a different commit.' >&2
            exit 1
          fi

      - name: Record tag outcome
        if: ${{ always() }}
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        run: |
          {
            echo '## Immutable tag result'
            echo "- Tag / SHA: ${RELEASE_TAG} / ${RELEASE_SHA:-unavailable}"
            echo "- Artifact ID: ${{ needs.prepare.outputs.prepared_artifact_id }}"
            echo "- Tag step: ${{ steps.tag.outcome }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify original bytes against the tagged source
        env:
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        run: |
          set -euo pipefail
          node scripts/release-artifact-evidence.mjs verify \
            --artifact-dir "$RUNNER_TEMP/prepared/site-artifact" --evidence "$RUNNER_TEMP/prepared/release-evidence.json" \
            --source-dir "$RUNNER_TEMP/prepared-source" --source-sha "$RELEASE_SHA"

      - name: Validate configured Cloudflare Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo 'Configured Cloudflare account ID is invalid.' >&2
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo 'Configured Cloudflare Pages project name is invalid.' >&2
            exit 1
          fi

      - name: Validate configured Cloudflare Pages production branch
        id: production_branch
        env:
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH }}
        shell: bash
        run: |
          set -euo pipefail
          production_branch="$(node scripts/validate-cloudflare-pages-branch.mjs \
            --branch "$CLOUDFLARE_PAGES_PRODUCTION_BRANCH")"
          echo "branch=$production_branch" >> "$GITHUB_OUTPUT"

      - name: Resolve release preview branch
        id: preview_branch
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
        run: |
          set -euo pipefail
          preview_branch="$(node scripts/release-preview-branch.mjs --tag "$RELEASE_TAG")"
          echo "branch=$preview_branch" >> "$GITHUB_OUTPUT"

      - name: Reject a preview branch that collides with production
        env:
          PREVIEW_BRANCH: ${{ steps.preview_branch.outputs.branch }}
          PRODUCTION_BRANCH: ${{ steps.production_branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREVIEW_BRANCH" == "$PRODUCTION_BRANCH" ]]; then
            echo 'Release preview branch must differ from the configured production branch.' >&2
            exit 1
          fi

      - name: Install deployment smoke dependencies
        id: smoke_dependencies
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Verify Cloudflare production branch before preview upload
        id: preview_pages_project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PRODUCTION_BRANCH: ${{ steps.production_branch.outputs.branch }}
          PREVIEW_BRANCH: ${{ steps.preview_branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/cloudflare-pages-project.json"
          trap 'rm -f "$response_file"' EXIT
          if ! http_status="$(curl --silent --output "$response_file" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT" \
            2>/dev/null)"; then
            echo 'Cloudflare Pages project configuration request failed.' >&2
            exit 1
          fi
          if [[ "$http_status" != 200 ]]; then
            echo "Cloudflare Pages project configuration could not be verified (HTTP $http_status)." >&2
            exit 1
          fi
          production_branch="$(node scripts/verify-cloudflare-pages-project.mjs \
            --response "$response_file" --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --production-branch "$PRODUCTION_BRANCH" --preview-branch "$PREVIEW_BRANCH")"
          echo "branch=$production_branch" >> "$GITHUB_OUTPUT"

      - name: Deploy the verified artifact to the Cloudflare preview environment
        id: preview_deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy "${{ runner.temp }}/prepared/site-artifact" --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ steps.preview_branch.outputs.branch }} --commit-hash=${{ needs.authorize.outputs.release_sha }}

      - name: Validate the Pages preview deployment identity
        id: preview_identity
        env:
          DEPLOYMENT_URL: ${{ steps.preview_deployment.outputs.deployment-url }}
          PAGES_ENVIRONMENT: ${{ steps.preview_deployment.outputs.pages-environment }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(node scripts/validate-cloudflare-pages-deployment.mjs \
            --deployment-url "$DEPLOYMENT_URL" --expected-environment preview \
            --pages-environment "$PAGES_ENVIRONMENT" \
            --project-name "$PAGES_PROJECT")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test the Cloudflare preview deployment
        id: preview_smoke
        if: ${{ always() && steps.preview_identity.outcome == 'success' && steps.smoke_dependencies.outcome == 'success' }}
        env:
          PREVIEW_URL: ${{ steps.preview_identity.outputs.deployment_url }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          run_smoke() {
            local application_result=passed
            local editor_result=passed

            if ! node scripts/validate-deployment-smoke.mjs --base-url "$PREVIEW_URL" --release-sha "$RELEASE_SHA" \
              --package-version "$PACKAGE_VERSION"; then
              application_result=failed
            fi
            if ! node scripts/check-online-editor.mjs --base-url "$PREVIEW_URL"; then
              editor_result=failed
            fi

            echo "application=$application_result" >> "$GITHUB_OUTPUT"
            echo "editor=$editor_result" >> "$GITHUB_OUTPUT"
            [[ "$application_result" == passed && "$editor_result" == passed ]]
          }
          run_smoke

      - name: Verify Cloudflare production branch before production upload
        id: production_pages_project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PRODUCTION_BRANCH: ${{ steps.production_branch.outputs.branch }}
          PREVIEW_BRANCH: ${{ steps.preview_branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/cloudflare-pages-project.json"
          trap 'rm -f "$response_file"' EXIT
          if ! http_status="$(curl --silent --output "$response_file" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT" \
            2>/dev/null)"; then
            echo 'Cloudflare Pages project configuration request failed.' >&2
            exit 1
          fi
          if [[ "$http_status" != 200 ]]; then
            echo "Cloudflare Pages project configuration could not be verified (HTTP $http_status)." >&2
            exit 1
          fi
          production_branch="$(node scripts/verify-cloudflare-pages-project.mjs \
            --response "$response_file" --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --production-branch "$PRODUCTION_BRANCH" --preview-branch "$PREVIEW_BRANCH")"
          echo "branch=$production_branch" >> "$GITHUB_OUTPUT"

      - name: Reverify the prepared artifact before production upload
        id: production_artifact_verify
        env:
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        run: |
          set -euo pipefail
          node scripts/release-artifact-evidence.mjs verify \
            --artifact-dir "$RUNNER_TEMP/prepared/site-artifact" --evidence "$RUNNER_TEMP/prepared/release-evidence.json" \
            --source-dir "$RUNNER_TEMP/prepared-source" --source-sha "$RELEASE_SHA"

      - name: Deploy the verified artifact to the Cloudflare production environment
        id: production_deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy "${{ runner.temp }}/prepared/site-artifact" --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ steps.production_pages_project.outputs.branch }} --commit-hash=${{ needs.authorize.outputs.release_sha }}

      - name: Validate the Pages production deployment identity
        id: production_identity
        env:
          DEPLOYMENT_URL: ${{ steps.production_deployment.outputs.deployment-url }}
          PAGES_ENVIRONMENT: ${{ steps.production_deployment.outputs.pages-environment }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(node scripts/validate-cloudflare-pages-deployment.mjs \
            --deployment-url "$DEPLOYMENT_URL" --expected-environment production \
            --pages-environment "$PAGES_ENVIRONMENT" \
            --project-name "$PAGES_PROJECT")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test production Pages.dev deployment and custom domain
        id: production_smoke
        if: ${{ always() && steps.production_identity.outcome == 'success' && steps.smoke_dependencies.outcome == 'success' }}
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
          PAGES_DEV_URL: ${{ steps.production_identity.outputs.deployment_url }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PRODUCTION_ORIGIN" = 'https://rs.herehigher.com/'

          run_smoke() {
            local label="$1"
            local base_url="$2"
            local application_result=passed
            local editor_result=passed

            if ! node scripts/validate-deployment-smoke.mjs --base-url "$base_url" --release-sha "$RELEASE_SHA" \
              --package-version "$PACKAGE_VERSION"; then
              application_result=failed
            fi
            if ! node scripts/check-online-editor.mjs --base-url "$base_url"; then
              editor_result=failed
            fi

            echo "${label}_application=$application_result" >> "$GITHUB_OUTPUT"
            echo "${label}_editor=$editor_result" >> "$GITHUB_OUTPUT"
            [[ "$application_result" == passed && "$editor_result" == passed ]]
          }

          smoke_result=0
          if ! run_smoke pages_dev "$PAGES_DEV_URL"; then smoke_result=1; fi
          if ! run_smoke custom_domain "$PRODUCTION_ORIGIN"; then smoke_result=1; fi
          exit "$smoke_result"

      - name: Record publication outcome
        if: ${{ always() }}
        env:
          ARTIFACT_DIGEST: ${{ steps.prepared.outputs.artifact_digest }}
          PREVIEW_BRANCH: ${{ steps.preview_branch.outputs.branch }}
          PRODUCTION_PAGES_BRANCH: ${{ steps.preview_pages_project.outputs.branch }}
          PREVIEW_BRANCH_CONFIG_OUTCOME: ${{ steps.preview_pages_project.outcome }}
          PRODUCTION_BRANCH_CONFIG_OUTCOME: ${{ steps.production_pages_project.outcome }}
          PREVIEW_DEPLOYMENT_OUTCOME: ${{ steps.preview_deployment.outcome }}
          PREVIEW_BRANCH_CONFIG_OUTCOME: ${{ steps.preview_pages_project.outcome }}
          PREVIEW_PAGES_ENVIRONMENT: ${{ steps.preview_deployment.outputs.pages-environment }}
          PREVIEW_IDENTITY_OUTCOME: ${{ steps.preview_identity.outcome }}
          PREVIEW_DEPLOYMENT_URL: ${{ steps.preview_identity.outputs.deployment_url }}
          PREVIEW_APPLICATION_SMOKE: ${{ steps.preview_smoke.outputs.application }}
          PREVIEW_EDITOR_SMOKE: ${{ steps.preview_smoke.outputs.editor }}
          PREVIEW_SMOKE_OUTCOME: ${{ steps.preview_smoke.outcome }}
          PRODUCTION_ARTIFACT_VERIFY_OUTCOME: ${{ steps.production_artifact_verify.outcome }}
          PRODUCTION_BRANCH_CONFIG_OUTCOME: ${{ steps.production_pages_project.outcome }}
          PRODUCTION_DEPLOYMENT_OUTCOME: ${{ steps.production_deployment.outcome }}
          PRODUCTION_PAGES_ENVIRONMENT: ${{ steps.production_deployment.outputs.pages-environment }}
          PRODUCTION_IDENTITY_OUTCOME: ${{ steps.production_identity.outcome }}
          PRODUCTION_DEPLOYMENT_URL: ${{ steps.production_identity.outputs.deployment_url }}
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
          PRODUCTION_PAGES_APPLICATION_SMOKE: ${{ steps.production_smoke.outputs.pages_dev_application }}
          PRODUCTION_PAGES_EDITOR_SMOKE: ${{ steps.production_smoke.outputs.pages_dev_editor }}
          CUSTOM_DOMAIN_APPLICATION_SMOKE: ${{ steps.production_smoke.outputs.custom_domain_application }}
          CUSTOM_DOMAIN_EDITOR_SMOKE: ${{ steps.production_smoke.outputs.custom_domain_editor }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
          PRODUCTION_SMOKE_OUTCOME: ${{ steps.production_smoke.outcome }}
          SMOKE_DEPENDENCIES_OUTCOME: ${{ steps.smoke_dependencies.outcome }}
          DEPLOYMENT_ARTIFACT_ID: ${{ needs.prepare.outputs.prepared_artifact_id }}
        shell: bash
        run: |
          summarize_outcome() {
            case "$1" in
              success) echo success ;;
              failure) echo failed ;;
              cancelled) echo cancelled ;;
              *) echo not-run ;;
            esac
          }
          preview_deployment_status="$(summarize_outcome "${PREVIEW_DEPLOYMENT_OUTCOME:-}")"
          preview_branch_config_status="$(summarize_outcome "${PREVIEW_BRANCH_CONFIG_OUTCOME:-}")"
          preview_smoke_status="$(summarize_outcome "${PREVIEW_SMOKE_OUTCOME:-}")"
          artifact_verify_status="$(summarize_outcome "${PRODUCTION_ARTIFACT_VERIFY_OUTCOME:-}")"
          production_branch_config_status="$(summarize_outcome "${PRODUCTION_BRANCH_CONFIG_OUTCOME:-}")"
          production_deployment_status="$(summarize_outcome "${PRODUCTION_DEPLOYMENT_OUTCOME:-}")"
          production_smoke_status="$(summarize_outcome "${PRODUCTION_SMOKE_OUTCOME:-}")"
          {
            echo '## Cloudflare release publication outcome'
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Source SHA: \`${RELEASE_SHA:-unavailable}\`"
            echo "- Run / artifact: \`${GITHUB_RUN_ID}\` / \`${DEPLOYMENT_ARTIFACT_ID:-unavailable}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-unavailable}\`"
            echo "- Artifact source: authorized release SHA \`${RELEASE_SHA:-unavailable}\` (passed as \`--commit-hash\` to both uploads)"
            echo "- Cloudflare production branch config checks: before preview ${preview_branch_config_status}; before production ${production_branch_config_status}"
            echo "- Preview branch: \`${PREVIEW_BRANCH:-not-run}\`; preview Direct Upload: ${preview_deployment_status}"
            echo "- Preview Pages environment: \`${PREVIEW_PAGES_ENVIRONMENT:-unavailable}\` (expected \`preview\`; identity validation: ${PREVIEW_IDENTITY_OUTCOME:-not-run})"
            echo "- Preview Pages.dev URL (validated): ${PREVIEW_DEPLOYMENT_URL:-not-accepted}"
            echo "- Preview smoke: application ${PREVIEW_APPLICATION_SMOKE:-not-run}; online editor ${PREVIEW_EDITOR_SMOKE:-not-run} (${preview_smoke_status})"
            echo "- Artifact reverify before production: ${artifact_verify_status}"
            echo "- Production Pages branch: \`${PRODUCTION_PAGES_BRANCH:-unavailable}\` (configured Cloudflare production route label)"
            echo "- Production Direct Upload: ${production_deployment_status}"
            echo "- Production Pages environment: \`${PRODUCTION_PAGES_ENVIRONMENT:-unavailable}\` (expected \`production\`; identity validation: ${PRODUCTION_IDENTITY_OUTCOME:-not-run})"
            echo "- Production Pages.dev URL (validated): ${PRODUCTION_DEPLOYMENT_URL:-not-accepted}"
            echo "- Custom domain URL: ${PRODUCTION_ORIGIN:-unavailable}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Tag: ${{ steps.tag.outcome }}; smoke dependencies: ${SMOKE_DEPENDENCIES_OUTCOME:-not-run}; production smoke: ${production_smoke_status}"
            echo "- Production Pages.dev smoke: application ${PRODUCTION_PAGES_APPLICATION_SMOKE:-not-run}; online editor ${PRODUCTION_PAGES_EDITOR_SMOKE:-not-run}"
            echo "- Custom domain smoke: application ${CUSTOM_DOMAIN_APPLICATION_SMOKE:-not-run}; online editor ${CUSTOM_DOMAIN_EDITOR_SMOKE:-not-run}"
            echo '- Unverified: manual browser acceptance and Cloudflare Web Analytics delivery.'
          } >> "$GITHUB_STEP_SUMMARY"
