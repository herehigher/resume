name: Release Pages

run-name: "Release Pages: ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: prepare creates a reviewed artifact; publish deploys one prepared artifact
        required: true
        type: choice
        options: [prepare, publish]
      pr_number:
        description: Merged release pull request number (prepare only)
        required: false
        type: string
      release_tag:
        description: Stable tag (publish), or accepted historical tag (recovery prepare)
        required: false
        type: string
      prepared_run_id:
        description: Successful prepare run ID (publish only)
        required: false
        type: string
      prepared_artifact_id:
        description: Immutable Pages artifact ID from the prepare summary (publish only)
        required: false
        type: string

permissions: {}

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.mode == 'prepare' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_digest: ${{ steps.evidence.outputs.artifact_digest }}
      package_version: ${{ steps.evidence.outputs.package_version }}
      prepared_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      source_digest: ${{ steps.evidence.outputs.source_digest }}
    steps:
      - name: Checkout release workflow
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve merged release commit or accepted recovery tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          if [[ -n "$RECOVERY_TAG" ]]; then
            test -z "$PR_NUMBER"
            node scripts/release-publication.mjs rollback --tag "$RECOVERY_TAG"
            release_sha="$(git rev-parse --verify --end-of-options "$RECOVERY_TAG^{commit}")"
            git merge-base --is-ancestor "$release_sha" "origin/${{ github.event.repository.default_branch }}"
            mkdir "$RUNNER_TEMP/release-source"
            git archive --format=tar "$release_sha" | tar -xf - -C "$RUNNER_TEMP/release-source"
            manifest_path="$RUNNER_TEMP/legacy-pages-release-manifest.json"
            node scripts/prepare-legacy-release-config.mjs "$RECOVERY_TAG" "$RUNNER_TEMP/release-source" "$manifest_path"
          else
            test -n "$PR_NUMBER"
            pr="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json baseRefName,mergeCommit,mergedAt)"
            test "$(jq -r '.baseRefName' <<<"$pr")" = "${{ github.event.repository.default_branch }}"
            test "$(jq -r '.mergedAt' <<<"$pr")" != "null"
            release_sha="$(jq -r '.mergeCommit.oid' <<<"$pr")"
            [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin "$release_sha"
            git merge-base --is-ancestor "$release_sha" "origin/${{ github.event.repository.default_branch }}"
            git worktree add --detach "$RUNNER_TEMP/release-source" "$release_sha"
            manifest_path="$RUNNER_TEMP/release-source/.github/pages-release-manifest.json"
          fi
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "analytics_mode=$(jq -r '.analyticsMode' "$manifest_path")" >> "$GITHUB_OUTPUT"
          echo "analytics_provider=$(jq -r '.analyticsProvider' "$manifest_path")" >> "$GITHUB_OUTPUT"

      - name: Verify the successful main Quality run for the exact release commit
        id: quality
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-run.mjs quality --sha "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare the single Pages artifact
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          ANALYTICS_MODE: ${{ steps.release.outputs.analytics_mode }}
          ANALYTICS_PROVIDER: ${{ steps.release.outputs.analytics_provider }}
          MANIFEST_PATH: ${{ steps.release.outputs.manifest_path }}
          SOURCE_ROOT: ${{ runner.temp }}/release-source
        shell: bash
        run: |
          set -euo pipefail
          token=''
          if [[ "$ANALYTICS_MODE" == enabled ]]; then token="$CLOUDFLARE_WEB_ANALYTICS_TOKEN"; fi
          CLOUDFLARE_WEB_ANALYTICS_TOKEN="$token" node scripts/prepare-pages-artifact.mjs prepare \
            --source "$SOURCE_ROOT/site" --output "$RUNNER_TEMP/pages-site" \
            --manifest "$MANIFEST_PATH" --repository "$GITHUB_REPOSITORY"
          node scripts/release-artifact-evidence.mjs create \
            --analytics-mode "$ANALYTICS_MODE" --analytics-provider "$ANALYTICS_PROVIDER" \
            --artifact-dir "$RUNNER_TEMP/pages-site" --evidence "$RUNNER_TEMP/release-evidence.json" \
            --source-dir "$SOURCE_ROOT" --source-sha "${{ steps.release.outputs.release_sha }}"
          node scripts/validate-pages-smoke.mjs --directory "$RUNNER_TEMP/pages-site" \
            --analytics-mode "$ANALYTICS_MODE" --analytics-provider "$ANALYTICS_PROVIDER" \
            --package-version "$(jq -r .version "$SOURCE_ROOT/package.json")"

      - name: Export non-secret artifact evidence
        id: evidence
        env:
          EVIDENCE: ${{ runner.temp }}/release-evidence.json
          QUALITY_RUN_ID: ${{ steps.quality.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact_digest=$(jq -r '.artifactDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "analytics_mode=$(jq -r '.analyticsMode' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "analytics_provider=$(jq -r '.analyticsProvider' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "package_version=$(jq -r '.packageVersion' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "source_digest=$(jq -r '.sourceDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          {
            echo '## Pages artifact prepared'
            echo
            echo "- Source SHA: \`${{ steps.release.outputs.release_sha }}\`"
            echo "- Version: \`$(jq -r '.packageVersion' "$EVIDENCE")\`"
            echo "- Source digest: \`$(jq -r '.sourceDigest' "$EVIDENCE")\`"
            echo "- Artifact digest: \`$(jq -r '.artifactDigest' "$EVIDENCE")\`"
            echo "- Documentation assets: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable prepared artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: pages-release-artifact
          path: |
            ${{ runner.temp }}/pages-site
            ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Record the exact publication command
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PACKAGE_VERSION: ${{ steps.evidence.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "- Publish: \`gh workflow run release.yml --ref ${{ github.event.repository.default_branch }} -f mode=publish -f prepared_run_id=${GITHUB_RUN_ID} -f prepared_artifact_id=${ARTIFACT_ID} -f release_tag=v${PACKAGE_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      release_sha: ${{ steps.prepared.outputs.release_sha }}
      analytics_mode: ${{ steps.prepared.outputs.analytics_mode }}
      analytics_provider: ${{ steps.prepared.outputs.analytics_provider }}
      artifact_digest: ${{ steps.prepared.outputs.artifact_digest }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate publication inputs and prepared run
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREPARED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PREPARED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$WORKFLOW_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          node scripts/validate-release-run.mjs prepared --run-id "$PREPARED_RUN_ID" --artifact-id "$PREPARED_ARTIFACT_ID"

      - name: Download only the selected prepared artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prepared
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.prepared_run_id }}

      - name: Read prepared source identity
        id: prepared
        env:
          EVIDENCE: ${{ runner.temp }}/prepared/release-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE"
          release_sha="$(jq -r '.sourceSha' "$EVIDENCE")"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "analytics_mode=$(jq -r '.analyticsMode' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "analytics_provider=$(jq -r '.analyticsProvider' "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$(jq -r '.artifactDigest' "$EVIDENCE")" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact prepared source beside trusted tooling
        env:
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/${{ github.event.repository.default_branch }}"
          git worktree add --detach "$RUNNER_TEMP/prepared-source" "$RELEASE_SHA"

      - name: Reverify bytes and create or resume the immutable tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ANALYTICS_MODE: ${{ steps.prepared.outputs.analytics_mode }}
          ANALYTICS_PROVIDER: ${{ steps.prepared.outputs.analytics_provider }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release-publication.mjs publish \
            --artifact-dir "$RUNNER_TEMP/prepared/pages-site" --evidence "$RUNNER_TEMP/prepared/release-evidence.json" \
            --source-dir "$RUNNER_TEMP/prepared-source" --source-sha "$RELEASE_SHA" --cwd . --tag "$RELEASE_TAG"
          remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          local_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ -z "$remote_sha" ]]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "refs/tags/$RELEASE_TAG"
          elif [[ "$remote_sha" != "$local_sha" ]]; then
            echo 'Remote tag points to a different commit.' >&2
            exit 1
          fi

      - name: Record tag outcome
        if: ${{ always() }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ steps.prepared.outputs.release_sha }}
        run: |
          {
            echo '## Immutable tag result'
            echo "- Tag / SHA: ${RELEASE_TAG} / ${RELEASE_SHA:-unavailable}"
            echo "- Tag step: ${{ steps.tag.outcome }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: ${{ inputs.mode == 'publish' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Revalidate the selected prepared run
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: node scripts/validate-release-run.mjs prepared --run-id "$PREPARED_RUN_ID" --artifact-id "$PREPARED_ARTIFACT_ID"

      - name: Download the same immutable artifact for deployment
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prepared
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.prepared_run_id }}

      - name: Verify original bytes against the tagged source
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
          ANALYTICS_MODE: ${{ needs.publish.outputs.analytics_mode }}
          ANALYTICS_PROVIDER: ${{ needs.publish.outputs.analytics_provider }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/${{ github.event.repository.default_branch }}"
          git worktree add --detach "$RUNNER_TEMP/prepared-source" "$RELEASE_SHA"
          node scripts/release-artifact-evidence.mjs verify \
            --analytics-mode "$ANALYTICS_MODE" --analytics-provider "$ANALYTICS_PROVIDER" \
            --artifact-dir "$RUNNER_TEMP/prepared/pages-site" --evidence "$RUNNER_TEMP/prepared/release-evidence.json" \
            --source-dir "$RUNNER_TEMP/prepared-source" --source-sha "$RELEASE_SHA"

      - name: Upload the verified original bytes for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/prepared/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Install online smoke dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test deployed public paths and editor
        id: smoke
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ANALYTICS_MODE: ${{ needs.publish.outputs.analytics_mode }}
          ANALYTICS_PROVIDER: ${{ needs.publish.outputs.analytics_provider }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-pages-smoke.mjs --base-url "${PAGE_URL%/}/" --release-sha "$RELEASE_SHA" \
            --analytics-mode "$ANALYTICS_MODE" --analytics-provider "$ANALYTICS_PROVIDER" \
            --package-version "${RELEASE_TAG#v}"
          node scripts/check-online-editor.mjs --base-url "${PAGE_URL%/}/"
          {
            echo '## Pages release result'
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Source SHA: \`$RELEASE_SHA\`"
            echo "- Prepared run: \`${{ inputs.prepared_run_id }}\`"
            echo "- URL: ${PAGE_URL}"
            echo '- Smoke: passed; live RUM receipt and manual browser acceptance remain unverified.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record publication outcome
        if: ${{ always() }}
        env:
          ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.publish.outputs.artifact_digest }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          {
            echo '## Pages publication outcome'
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Source SHA: \`${RELEASE_SHA:-unavailable}\`"
            echo "- Prepared run / artifact: \`${{ inputs.prepared_run_id }}\` / \`${ARTIFACT_ID}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-unavailable}\`"
            echo "- URL: ${PAGE_URL:-unavailable}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Tag step: ${{ needs.publish.result }}; deploy: ${{ steps.deployment.outcome }}; smoke: ${{ steps.smoke.outcome }}"
            echo '- Unverified: live RUM receipt and manual browser acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
