name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      checkout_ref:
        description: Full commit SHA to test when called by another workflow
        required: true
        type: string

permissions: {}

concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Classify pull request scope
        id: scope
        if: ${{ github.event_name == 'pull_request' && !inputs.checkout_ref }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/quality-scope.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Verify documentation-only pull request
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$BASE_SHA...$HEAD_SHA"
          node --test tests/documentation.test.js tests/quality-scope.test.js

  unit-static:
    needs: scope
    if: ${{ needs.scope.outputs.docs_only == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and static tests
        run: npm test

      - name: Lint
        run: npm run lint

  browser:
    needs: scope
    if: ${{ needs.scope.outputs.docs_only == 'false' }}
    name: browser-${{ matrix.partition }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: chromium-1
            browser: chromium
            projects: --project=desktop-chromium --project=mobile-chromium
            shard: 1/3
          - partition: chromium-2
            browser: chromium
            projects: --project=desktop-chromium --project=mobile-chromium
            shard: 2/3
          - partition: chromium-3
            browser: chromium
            projects: --project=desktop-chromium --project=mobile-chromium
            shard: 3/3
          - partition: webkit
            browser: webkit
            projects: --project=mobile-webkit --project=webkit
            shard: 1/1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install required browser
        run: npx playwright install --with-deps --only-shell ${{ matrix.browser }}

      - name: Browser and PDF acceptance tests
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: node_modules/.cache/resume-studio/playwright-reports
        run: npm run test:e2e -- ${{ matrix.projects }} --shard=${{ matrix.shard }} --reporter=line,blob

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: node_modules/.cache/resume-studio/playwright-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: node_modules/.cache/resume-studio/playwright-results/
          if-no-files-found: ignore
          retention-days: 7

  documentation-assets:
    needs: scope
    if: ${{ needs.scope.outputs.docs_only == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_assets_changed: ${{ steps.release_assets.outputs.changed }}
      release_assets_required: ${{ steps.release_assets.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify release documentation asset requirement
        id: release_assets
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/release-doc-assets.mjs required --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Generate temporary documentation assets
        env:
          DOCUMENTATION_ASSET_DIRECTORY: ${{ runner.temp }}/resume-documentation-assets
          QUALITY_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.checkout_ref || github.sha }}
        run: >-
          npm run generate:doc-assets --
          --output-dir "${DOCUMENTATION_ASSET_DIRECTORY}"
          --quality-run-id "${QUALITY_RUN_ID}"
          --source-sha "${SOURCE_SHA}"
          --producer-kind quality
          --producer-workflow .github/workflows/ci.yml
          --producer-run-attempt "${{ github.run_attempt }}"
          --producer-control-sha "${{ github.sha }}"

      - name: Verify temporary documentation assets
        env:
          DOCUMENTATION_ASSET_DIRECTORY: ${{ runner.temp }}/resume-documentation-assets
          SOURCE_SHA: ${{ inputs.checkout_ref || github.sha }}
        run: >-
          npm run verify:doc-assets --
          --asset-root "${DOCUMENTATION_ASSET_DIRECTORY}"
          --source-root "${GITHUB_WORKSPACE}"
          --source-sha "${SOURCE_SHA}"

      - name: Classify release asset check
        id: release_asset_check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          ASSETS_CHANGED: ${{ steps.release_assets.outputs.changed }}
          ASSETS_REQUIRED: ${{ steps.release_assets.outputs.required }}
        run: node scripts/release-assets-summary.mjs classify "$ASSETS_REQUIRED" "$ASSETS_CHANGED"

      - name: Report release assets are not required
        if: ${{ github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'not-required' }}
        run: echo "This pull request does not change the package version or release documentation assets."

      - name: Reject release asset changes outside a version pull request
        if: ${{ github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'versionless-asset-change' }}
        run: |
          node scripts/release-assets-summary.mjs failure versionless-asset-change
          exit 1

      - name: Report missing release documentation assets
        if: ${{ github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'promotion-required' }}
        run: |
          node scripts/release-assets-summary.mjs failure release-assets-missing
          exit 1

      - name: Materialize release asset LFS files
        if: ${{ github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'verification-required' }}
        run: >-
          git lfs pull
          --include="docs/screenshots/en.png,docs/screenshots/ja.png,docs/screenshots/zh-CN.png,output/pdf/en-letter.pdf,output/pdf/ja-a4.pdf,output/pdf/zh-CN-a4.pdf"
          --exclude=""

      - name: Resolve promoted candidate artifact provenance
        id: provenance
        if: ${{ github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'verification-required' }}
        continue-on-error: true
        run: node scripts/release-doc-assets.mjs provenance --committed-root "${GITHUB_WORKSPACE}"

      - name: Resolve exact candidate artifact identity
        id: candidate_evidence
        if: ${{ github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'verification-required' && steps.provenance.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ steps.provenance.outputs.control_sha }}
          RUN_ATTEMPT: ${{ steps.provenance.outputs.run_attempt }}
          RUN_ID: ${{ steps.provenance.outputs.run_id }}
          SOURCE_SHA: ${{ steps.provenance.outputs.checkout_commit }}
        run: >-
          node scripts/promote-pr-doc-assets.mjs candidate-evidence
          --source-sha "${SOURCE_SHA}"
          --run-id "${RUN_ID}"
          --run-attempt "${RUN_ATTEMPT}"
          --control-sha "${CONTROL_SHA}"

      - name: Download the originally promoted candidate artifact
        id: promoted_evidence
        if: ${{ github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'verification-required' && steps.provenance.outcome == 'success' && steps.candidate_evidence.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.candidate_evidence.outputs.artifact_id }}
          path: ${{ runner.temp }}/promoted-documentation-assets
          run-id: ${{ steps.candidate_evidence.outputs.run_id }}

      - name: Verify release documentation assets are current
        id: currentness
        if: ${{ github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'verification-required' && steps.provenance.outcome == 'success' && steps.candidate_evidence.outcome == 'success' && steps.promoted_evidence.outcome == 'success' }}
        continue-on-error: true
        env:
          DOCUMENTATION_ASSET_DIRECTORY: ${{ runner.temp }}/resume-documentation-assets
          PROMOTED_ASSET_DIRECTORY: ${{ runner.temp }}/promoted-documentation-assets
          SOURCE_SHA: ${{ inputs.checkout_ref || github.sha }}
        run: >-
          node scripts/release-doc-assets.mjs compare
          --committed-root "${GITHUB_WORKSPACE}"
          --generated-root "${DOCUMENTATION_ASSET_DIRECTORY}"
          --promoted-root "${PROMOTED_ASSET_DIRECTORY}"
          --source-sha "${SOURCE_SHA}"

      - name: Report invalid committed provenance
        if: ${{ always() && github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'verification-required' && steps.provenance.outcome != 'success' }}
        run: |
          node scripts/release-assets-summary.mjs failure provenance-invalid
          exit 1

      - name: Report unavailable candidate artifact evidence
        if: ${{ always() && github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'verification-required' && steps.provenance.outcome == 'success' && (steps.candidate_evidence.outcome != 'success' || steps.promoted_evidence.outcome != 'success') }}
        run: |
          node scripts/release-assets-summary.mjs failure promoted-evidence-unavailable
          exit 1

      - name: Report release asset integrity mismatch
        if: ${{ always() && github.event_name == 'pull_request' && steps.release_asset_check.outputs.classification == 'verification-required' && steps.provenance.outcome == 'success' && steps.candidate_evidence.outcome == 'success' && steps.promoted_evidence.outcome == 'success' && steps.currentness.outcome != 'success' }}
        run: |
          node scripts/release-assets-summary.mjs failure asset-integrity-mismatch
          exit 1

      - name: Upload documentation asset evidence
        uses: actions/upload-artifact@v7
        with:
          name: documentation-assets-${{ inputs.checkout_ref || github.sha }}
          path: ${{ runner.temp }}/resume-documentation-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  quality:
    needs: [scope, unit-static, browser, documentation-assets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_assets_changed: ${{ needs.documentation-assets.outputs.release_assets_changed }}
      release_assets_required: ${{ needs.documentation-assets.outputs.release_assets_required }}
      quality_run_id: ${{ steps.quality_identity.outputs.run_id }}
    steps:
      - name: Record actual Quality run identity
        id: quality_identity
        run: echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify required Quality jobs
        env:
          QUALITY_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/quality-results.mjs
