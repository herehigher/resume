name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      checkout_ref:
        description: Full commit SHA to test when called by another workflow
        required: true
        type: string

permissions: {}

concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_assets_changed: ${{ steps.release_assets.outputs.changed }}
      release_assets_required: ${{ steps.release_assets.outputs.required }}
      quality_run_id: ${{ steps.quality_identity.outputs.run_id }}
    steps:
      - name: Record actual Quality run identity
        id: quality_identity
        run: echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify pull request scope
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/quality-scope.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Classify release documentation asset requirement
        id: release_assets
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/release-doc-assets.mjs required --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ github.event_name != 'pull_request' || steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true' }}
        run: npm ci

      - name: Unit and static tests
        if: ${{ github.event_name != 'pull_request' || steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true' }}
        run: npm test

      - name: Lint
        if: ${{ github.event_name != 'pull_request' || steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true' }}
        run: npm run lint

      - name: Install Chromium and WebKit
        if: ${{ github.event_name != 'pull_request' || steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true' }}
        run: npx playwright install --with-deps --only-shell chromium webkit

      - name: Browser and PDF acceptance tests
        if: ${{ github.event_name != 'pull_request' || steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true' }}
        run: npm run test:e2e

      - name: Generate temporary documentation assets
        if: ${{ github.event_name != 'pull_request' || steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true' }}
        env:
          DOCUMENTATION_ASSET_DIRECTORY: ${{ runner.temp }}/resume-documentation-assets
          QUALITY_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.checkout_ref || github.sha }}
        run: >-
          npm run generate:doc-assets --
          --output-dir "${DOCUMENTATION_ASSET_DIRECTORY}"
          --quality-run-id "${QUALITY_RUN_ID}"
          --source-sha "${SOURCE_SHA}"

      - name: Verify temporary documentation assets
        if: ${{ github.event_name != 'pull_request' || steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true' }}
        env:
          DOCUMENTATION_ASSET_DIRECTORY: ${{ runner.temp }}/resume-documentation-assets
          SOURCE_SHA: ${{ inputs.checkout_ref || github.sha }}
        run: >-
          npm run verify:doc-assets --
          --asset-root "${DOCUMENTATION_ASSET_DIRECTORY}"
          --source-root "${GITHUB_WORKSPACE}"
          --source-sha "${SOURCE_SHA}"

      - name: Upload documentation asset evidence
        if: ${{ (github.event_name != 'pull_request' || steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true') && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: documentation-assets-${{ inputs.checkout_ref || github.sha }}
          path: ${{ runner.temp }}/resume-documentation-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: node_modules/.cache/resume-studio/playwright-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify documentation-only pull request
        if: ${{ github.event_name == 'pull_request' && steps.scope.outcome == 'success' && steps.scope.outputs.docs_only == 'true' }}
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          node --test tests/documentation.test.js tests/quality-scope.test.js

      - name: Reject pull request scope classification failure
        if: ${{ always() && github.event_name == 'pull_request' && steps.scope.outcome == 'failure' }}
        run: exit 1

  release-assets-current:
    name: Release assets current
    needs: quality
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout workflow summary tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Report Quality failure
        if: ${{ needs.quality.result != 'success' }}
        run: |
          node scripts/release-assets-summary.mjs failure quality-failure
          exit 1

      - name: Classify release asset check
        id: classification
        if: ${{ needs.quality.result == 'success' }}
        env:
          ASSETS_CHANGED: ${{ needs.quality.outputs.release_assets_changed }}
          ASSETS_REQUIRED: ${{ needs.quality.outputs.release_assets_required }}
        run: node scripts/release-assets-summary.mjs classify "$ASSETS_REQUIRED" "$ASSETS_CHANGED"

      - name: Report release assets are not required
        if: ${{ steps.classification.outputs.classification == 'not-required' }}
        run: echo "This pull request does not change the package version or release documentation assets."

      - name: Reject release asset changes outside a version pull request
        if: ${{ steps.classification.outputs.classification == 'versionless-asset-change' }}
        run: |
          node scripts/release-assets-summary.mjs failure versionless-asset-change
          exit 1

      - name: Checkout release asset verification source
        if: ${{ steps.classification.outputs.classification == 'promotion-required' || steps.classification.outputs.classification == 'verification-required' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ steps.classification.outputs.classification == 'promotion-required' || steps.classification.outputs.classification == 'verification-required' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read candidate version from the checked-out merge source
        id: candidate
        if: ${{ steps.classification.outputs.classification == 'promotion-required' || steps.classification.outputs.classification == 'verification-required' }}
        run: >-
          node -e "const fs=require('node:fs'); const version=JSON.parse(fs.readFileSync('package.json','utf8')).version; if (!/^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$/.test(version || '')) process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'candidate_version=' + version + '\\n');"

      - name: Resolve exact current Quality evidence
        id: quality_evidence
        if: ${{ steps.classification.outputs.classification == 'promotion-required' || steps.classification.outputs.classification == 'verification-required' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUALITY_RUN_ID: ${{ needs.quality.outputs.quality_run_id }}
          SOURCE_MERGE_SHA: ${{ github.sha }}
        run: >-
          node scripts/promote-pr-doc-assets.mjs evidence
          --pr "${PR_NUMBER}"
          --quality-run-id "${QUALITY_RUN_ID}"
          --source-merge-sha "${SOURCE_MERGE_SHA}"

      - name: Report unavailable current Quality evidence
        if: ${{ (steps.classification.outputs.classification == 'promotion-required' || steps.classification.outputs.classification == 'verification-required') && steps.quality_evidence.outcome != 'success' }}
        run: |
          node scripts/release-assets-summary.mjs failure current-evidence-unavailable
          exit 1

      - name: Report promotion required
        if: ${{ steps.classification.outputs.classification == 'promotion-required' && steps.quality_evidence.outcome == 'success' }}
        env:
          ARTIFACT_NAME: ${{ steps.quality_evidence.outputs.artifact_name }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.candidate_version }}
          PR_NUMBER: ${{ steps.quality_evidence.outputs.pull_request_number }}
          QUALITY_RUN_ID: ${{ steps.quality_evidence.outputs.quality_run_id }}
          SOURCE_MERGE_SHA: ${{ steps.quality_evidence.outputs.source_merge_sha }}
        run: |
          node scripts/release-assets-summary.mjs promotion-required "$CANDIDATE_VERSION" "$PR_NUMBER" "$QUALITY_RUN_ID" "$SOURCE_MERGE_SHA" "$ARTIFACT_NAME"
          exit 1

      - name: Install documentation asset verification dependencies
        if: ${{ steps.classification.outputs.classification == 'verification-required' && steps.quality_evidence.outcome == 'success' }}
        run: npm ci

      - name: Resolve promoted Quality artifact provenance
        id: provenance
        if: ${{ steps.classification.outputs.classification == 'verification-required' && steps.quality_evidence.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/release-doc-assets.mjs provenance --committed-root "${GITHUB_WORKSPACE}"

      - name: Download documentation asset evidence
        id: current_evidence
        if: ${{ steps.classification.outputs.classification == 'verification-required' && steps.quality_evidence.outcome == 'success' && steps.provenance.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: documentation-assets-${{ github.sha }}
          path: ${{ runner.temp }}/resume-documentation-assets

      - name: Download the originally promoted Quality artifact
        id: promoted_evidence
        if: ${{ steps.classification.outputs.classification == 'verification-required' && steps.quality_evidence.outcome == 'success' && steps.provenance.outcome == 'success' && steps.current_evidence.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: ${{ steps.provenance.outputs.artifact_name }}
          path: ${{ runner.temp }}/promoted-documentation-assets
          run-id: ${{ steps.provenance.outputs.quality_run_id }}

      - name: Verify release documentation assets are current
        id: currentness
        if: ${{ steps.classification.outputs.classification == 'verification-required' && steps.quality_evidence.outcome == 'success' && steps.provenance.outcome == 'success' && steps.current_evidence.outcome == 'success' && steps.promoted_evidence.outcome == 'success' }}
        continue-on-error: true
        env:
          DOCUMENTATION_ASSET_DIRECTORY: ${{ runner.temp }}/resume-documentation-assets
          PROMOTED_ASSET_DIRECTORY: ${{ runner.temp }}/promoted-documentation-assets
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          node scripts/release-doc-assets.mjs compare
          --committed-root "${GITHUB_WORKSPACE}"
          --generated-root "${DOCUMENTATION_ASSET_DIRECTORY}"
          --promoted-root "${PROMOTED_ASSET_DIRECTORY}"
          --source-sha "${SOURCE_SHA}"

      - name: Report invalid committed provenance
        if: ${{ always() && steps.classification.outputs.classification == 'verification-required' && steps.quality_evidence.outcome == 'success' && steps.provenance.outcome != 'success' }}
        run: |
          node scripts/release-assets-summary.mjs failure provenance-invalid
          exit 1

      - name: Report unavailable promoted Quality artifact
        if: ${{ always() && steps.classification.outputs.classification == 'verification-required' && steps.quality_evidence.outcome == 'success' && steps.provenance.outcome == 'success' && (steps.current_evidence.outcome != 'success' || steps.promoted_evidence.outcome != 'success') }}
        run: |
          node scripts/release-assets-summary.mjs failure promoted-evidence-unavailable
          exit 1

      - name: Report release asset integrity mismatch
        if: ${{ always() && steps.classification.outputs.classification == 'verification-required' && steps.quality_evidence.outcome == 'success' && steps.provenance.outcome == 'success' && steps.current_evidence.outcome == 'success' && steps.promoted_evidence.outcome == 'success' && steps.currentness.outcome != 'success' }}
        run: |
          node scripts/release-assets-summary.mjs failure asset-integrity-mismatch
          exit 1
