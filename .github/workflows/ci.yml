name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      checkout_ref:
        description: Full commit SHA to test when called by another workflow
        required: true
        type: string

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and static tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and PDF acceptance tests
        run: npm run test:e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: node_modules/.cache/resume-studio/playwright-results/
          if-no-files-found: ignore
          retention-days: 7
