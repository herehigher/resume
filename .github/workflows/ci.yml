name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      checkout_ref:
        description: Full commit SHA to test when called by another workflow
        required: true
        type: string

permissions: {}

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify pull request scope
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/quality-scope.mjs "$BASE_SHA" "$HEAD_SHA"

  quality:
    needs: scope
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true' }}
        run: npm ci

      - name: Unit and static tests
        if: ${{ github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true' }}
        run: npm test

      - name: Lint
        if: ${{ github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true' }}
        run: npm run lint

      - name: Install Chromium
        if: ${{ github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Browser and PDF acceptance tests
        if: ${{ github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true' }}
        run: npm run test:e2e

      - name: Generate temporary documentation assets
        if: ${{ github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true' }}
        env:
          DOCUMENTATION_ASSET_DIRECTORY: ${{ runner.temp }}/resume-documentation-assets
          SOURCE_SHA: ${{ inputs.checkout_ref || github.sha }}
        run: >-
          npm run generate:doc-assets --
          --output-dir "${DOCUMENTATION_ASSET_DIRECTORY}"
          --source-sha "${SOURCE_SHA}"

      - name: Verify temporary documentation assets
        if: ${{ github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true' }}
        env:
          DOCUMENTATION_ASSET_DIRECTORY: ${{ runner.temp }}/resume-documentation-assets
          SOURCE_SHA: ${{ inputs.checkout_ref || github.sha }}
        run: >-
          npm run verify:doc-assets --
          --asset-root "${DOCUMENTATION_ASSET_DIRECTORY}"
          --source-root "${GITHUB_WORKSPACE}"
          --source-sha "${SOURCE_SHA}"

      - name: Upload documentation asset evidence
        if: ${{ (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: documentation-assets-${{ inputs.checkout_ref || github.sha }}
          path: ${{ runner.temp }}/resume-documentation-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: node_modules/.cache/resume-studio/playwright-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify documentation-only pull request
        if: ${{ github.event_name == 'pull_request' && needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'true' }}
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          node --test tests/documentation.test.js tests/quality-scope.test.js
