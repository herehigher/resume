name: Reconcile Cloudflare production intent

on:
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    if: ${{ github.repository == 'herehigher/resume' && github.ref == 'refs/heads/main' && github.actor == 'herehigher' && github.triggering_actor == 'herehigher' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment: production
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout trusted reconciliation tooling from main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Inspect the unresolved intent and Cloudflare current deployment
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: node scripts/production-state.mjs inspect-recovery

      - name: Install smoke verification dependencies for a switched deployment
        id: smoke_dependencies
        if: ${{ always() && steps.inspect.outputs.needs_smoke == 'true' }}
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Smoke test reconciled Pages.dev deployment
        id: pages_smoke
        if: ${{ always() && steps.inspect.outputs.needs_smoke == 'true' && steps.smoke_dependencies.outcome == 'success' }}
        env:
          PAGES_URL: ${{ steps.inspect.outputs.current_url }}
          RELEASE_SHA: ${{ steps.inspect.outputs.target_sha }}
          PACKAGE_VERSION: ${{ steps.inspect.outputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${PACKAGE_VERSION#v}"
          application=passed
          editor=passed
          node scripts/validate-deployment-smoke.mjs --base-url "$PAGES_URL" --release-sha "$RELEASE_SHA" --package-version "$version" || application=failed
          node scripts/check-online-editor.mjs --base-url "$PAGES_URL" || editor=failed
          echo "application=$application" >> "$GITHUB_OUTPUT"
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          [[ "$application" == passed && "$editor" == passed ]]

      - name: Smoke test reconciled custom-domain deployment
        id: custom_smoke
        if: ${{ always() && steps.inspect.outputs.needs_smoke == 'true' && steps.smoke_dependencies.outcome == 'success' }}
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
          RELEASE_SHA: ${{ steps.inspect.outputs.target_sha }}
          PACKAGE_VERSION: ${{ steps.inspect.outputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${PACKAGE_VERSION#v}"
          test "$PRODUCTION_ORIGIN" = 'https://rs.herehigher.com/'
          application=passed
          editor=passed
          node scripts/validate-deployment-smoke.mjs --base-url "$PRODUCTION_ORIGIN" --release-sha "$RELEASE_SHA" --package-version "$version" || application=failed
          node scripts/check-online-editor.mjs --base-url "$PRODUCTION_ORIGIN" || editor=failed
          echo "application=$application" >> "$GITHUB_OUTPUT"
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          [[ "$application" == passed && "$editor" == passed ]]

      - name: Record the reconciled outcome
        if: ${{ always() && steps.inspect.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RECOVERY_PAGES_APPLICATION_SMOKE: ${{ steps.pages_smoke.outputs.application }}
          RECOVERY_PAGES_EDITOR_SMOKE: ${{ steps.pages_smoke.outputs.editor }}
          RECOVERY_CUSTOM_APPLICATION_SMOKE: ${{ steps.custom_smoke.outputs.application }}
          RECOVERY_CUSTOM_EDITOR_SMOKE: ${{ steps.custom_smoke.outputs.editor }}
        run: node scripts/production-state.mjs finish-recovery
