name: Roll back Cloudflare production

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: Accepted prior Cloudflare production release
        required: true
        type: string
      recover_unverified_release:
        description: Explicitly recover a switched release whose smoke verification failed
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  rollback:
    if: ${{ github.repository == 'herehigher/resume' && github.ref == 'refs/heads/main' && github.actor == 'herehigher' && github.triggering_actor == 'herehigher' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment: production
    permissions:
      actions: read
      contents: read
      deployments: write
    steps:
      - name: Checkout trusted rollback tooling from main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate accepted target and persist rollback intent
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          TARGET_TAG: ${{ inputs.target_tag }}
          RECOVER_UNVERIFIED_RELEASE: ${{ inputs.recover_unverified_release }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: node scripts/production-state.mjs start-rollback

      - name: Request Cloudflare native rollback and verify the current deployment ID
        id: switch
        if: ${{ steps.preflight.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: node scripts/production-state.mjs execute-rollback

      - name: Install smoke verification dependencies after the production switch
        id: smoke_dependencies
        if: ${{ always() && steps.switch.outcome == 'success' }}
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Smoke test the current Pages.dev rollback deployment
        id: pages_smoke
        if: ${{ always() && steps.switch.outcome == 'success' && steps.smoke_dependencies.outcome == 'success' }}
        env:
          PAGES_URL: ${{ steps.switch.outputs.current_url }}
          RELEASE_SHA: ${{ steps.preflight.outputs.target_sha }}
          PACKAGE_VERSION: ${{ inputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${PACKAGE_VERSION#v}"
          application=passed
          editor=passed
          node scripts/validate-deployment-smoke.mjs --base-url "$PAGES_URL" --release-sha "$RELEASE_SHA" --package-version "$version" || application=failed
          node scripts/check-online-editor.mjs --base-url "$PAGES_URL" || editor=failed
          echo "application=$application" >> "$GITHUB_OUTPUT"
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          [[ "$application" == passed && "$editor" == passed ]]

      - name: Smoke test the custom-domain rollback deployment
        id: custom_smoke
        if: ${{ always() && steps.switch.outcome == 'success' && steps.smoke_dependencies.outcome == 'success' }}
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
          RELEASE_SHA: ${{ steps.preflight.outputs.target_sha }}
          PACKAGE_VERSION: ${{ inputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${PACKAGE_VERSION#v}"
          test "$PRODUCTION_ORIGIN" = 'https://rs.herehigher.com/'
          application=passed
          editor=passed
          node scripts/validate-deployment-smoke.mjs --base-url "$PRODUCTION_ORIGIN" --release-sha "$RELEASE_SHA" --package-version "$version" || application=failed
          node scripts/check-online-editor.mjs --base-url "$PRODUCTION_ORIGIN" || editor=failed
          echo "application=$application" >> "$GITHUB_OUTPUT"
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          [[ "$application" == passed && "$editor" == passed ]]

      - name: Record whether rollback switched and passed verification
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          ROLLBACK_SWITCH_OUTCOME: ${{ steps.switch.outcome }}
          ROLLBACK_PAGES_APPLICATION_SMOKE: ${{ steps.pages_smoke.outputs.application }}
          ROLLBACK_PAGES_EDITOR_SMOKE: ${{ steps.pages_smoke.outputs.editor }}
          ROLLBACK_CUSTOM_APPLICATION_SMOKE: ${{ steps.custom_smoke.outputs.application }}
          ROLLBACK_CUSTOM_EDITOR_SMOKE: ${{ steps.custom_smoke.outputs.editor }}
        run: node scripts/production-state.mjs finish-rollback
